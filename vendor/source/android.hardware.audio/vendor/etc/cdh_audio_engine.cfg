# CDH audio 引擎音量组配置（gold-15 / Redmi Note 13 5G, android15）
#
# 供自研 audio HAL 的 IConfig.getEngineConfig() 在启动时读取，据此构建
# AudioHalEngineConfig.volumeGroups。曲线值取自小米 /system_ext 引擎音量配置
# （与 audio_policy_engine_default_stream_volumes.xml 一致）。设备改音量只需编辑本文件，
# 无需改动驱动源码（对比 note13-5G-15 把这 13 组硬编码进 ConfigImpl.cpp）。
#
# 语法（零外部依赖，'#' 注释、空行忽略）：
#   group = <name> | <minIndex> | <maxIndex>          # name 必须精确 = AUDIO_STREAM_<X>
#   curve = <DeviceCategory> | <idx,att>; <idx,att>…  # 紧接所属 group，可多条
#             # DeviceCategory ∈ HEADSET|SPEAKER|EARPIECE|EXT_MEDIA|HEARING_AID
# 说明：productStrategies 恒为空（默认引擎用内置策略集；填了会触发小米闭源扩展
#       AudioPolicyManagerCustomImpl map::at 崩溃 audioserver）。

# 卷组名 = 引擎默认策略引用的流类型字符串（必须精确匹配，否则音量组塌缩为 Min/Max=0）
group = AUDIO_STREAM_VOICE_CALL | 1 | 7
curve = HEADSET     | 0,-4200; 33,-2800; 66,-1400; 100,0
curve = SPEAKER     | 0,-2400; 33,-1600; 66,-800; 100,0
curve = EARPIECE    | 0,-2700; 33,-1800; 66,-900; 100,0
curve = EXT_MEDIA   | 1,-5800; 20,-4000; 60,-1700; 100,0
curve = HEARING_AID | 1,-12700; 20,-8000; 60,-4000; 100,0

