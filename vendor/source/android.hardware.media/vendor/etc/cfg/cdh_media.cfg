# gold（Redmi Note 13 5G, android15）Codec2 假登记 store 设备值（运行时读取，零依赖行式）。
# 驱动 src/codec2_store_service.cpp 按 env CDH_MEDIA_CFG（缺则本路径）加载。
# 每行 `key = 段1 | 段2 | ...`，'#' 起注释；子表内用 ',' 分隔、可留空。
#   instance  = <二进制 basename> | <实例名>
#   component = <实例> | <name> | <kind> | <domain> | <mediaType> | <rank> | <aliases> | <profiles> | <levels>
# 组件值（rank/aliases/profiles/levels）取自真机 dumpsys media.player，见原 config/codec2.json。

instance = android.hardware.media.c2-mediatek | default1
instance = vendor.dolby.media.c2-default-service-dax | default9

# ---- default1 (MTK 硬件 C2 store（假登记，) ----
component = default1 | c2.mtk.hevc.decoder | decoder | video | video/hevc | 512 | OMX.MTK.VIDEO.DECODER.HEVC | 24576,24578,24577 | 24835
component = default1 | c2.mtk.hevc.decoder.secure | decoder | video | video/hevc | 512 | OMX.MTK.VIDEO.DECODER.HEVC.secure | 24576,24578,24577 | 24835
component = default1 | c2.mtk.mpeg4.decoder | decoder | video | video/mp4v-es | 512 | OMX.MTK.VIDEO.DECODER.MPEG4 | 12297,12308 | 16393
component = default1 | c2.mtk.mpeg2.decoder | decoder | video | video/mpeg2 | 512 | OMX.MTK.VIDEO.DECODER.MPEG2 | 4097 | 4099
component = default1 | c2.mtk.h263.decoder | decoder | video | video/3gpp | 512 | OMX.MTK.VIDEO.DECODER.H263 | 12288 | 12291,12292,12293,12294,12295
component = default1 | c2.mtk.avc.decoder | decoder | video | video/avc | 512 | OMX.MTK.VIDEO.DECODER.AVC | 20480,20481,20482,20484,20487 | 20495
component = default1 | c2.mtk.avc.decoder.secure | decoder | video | video/avc | 512 | OMX.MTK.VIDEO.DECODER.AVC.secure | 20480,20481,20482,20484,20487 | 20495
component = default1 | c2.mtk.heif.decoder | decoder | video | image/vnd.android.heic | 512 | OMX.MTK.VIDEO.DECODER.HEIF |  | 
component = default1 | c2.mtk.vpx.decoder | decoder | video | video/x-vnd.on2.vp8 | 512 | OMX.MTK.VIDEO.DECODER.VPX | 40960 | 1
component = default1 | c2.mtk.vp9.decoder | decoder | video | video/x-vnd.on2.vp9 | 512 | OMX.MTK.VIDEO.DECODER.VP9 | 28672,28673,28674 | 28680
component = default1 | c2.mtk.vp9.decoder.secure | decoder | video | video/x-vnd.on2.vp9 | 512 | OMX.MTK.VIDEO.DECODER.VP9.secure | 28672,28673,28674 | 28680
component = default1 | c2.mtk.avc.encoder | encoder | video | video/avc | 512 | OMX.MTK.VIDEO.ENCODER.AVC | 20480,20482,20484 | 20494
component = default1 | c2.mtk.avc.encoder.secure | encoder | video | video/avc | 512 |  | 20480,20482,20484 | 20494
component = default1 | c2.mtk.hevc.encoder | encoder | video | video/hevc | 512 | OMX.MTK.VIDEO.ENCODER.HEVC | 24576 | 24834
component = default1 | c2.mtk.heif.encoder | encoder | video | image/vnd.android.heic | 512 |  |  | 

# ---- default9 (Dolby AC3/EAC3/AC4 a) ----
component = default9 | c2.dolby.eac3.decoder | decoder | audio | audio/eac3 | 8 |  |  | 
component = default9 | c2.dolby.ac4.decoder | decoder | audio | audio/ac4 | 8 | OMX.dolby.ac4.decoder |  |
