# gold（Redmi Note 13 5G, android15）wifi HAL 设备值外置配置。
# 由引擎 src/cdh_wifi_config.h 运行时读取（env CDH_WIFI_CFG 覆盖路径）。
# 取代设备树 config/wifi.json 生成的编译期 wifi_target.inc——换机型改本文件即可，不重编 HAL。
# 格式：key = value；'#' 起为行内注释。缺文件/缺键回落到内置默认（与下方一致）。

# 宿主 wifi 控制通道（QEMU unix socket chardev 承载的 hvc 节点）
channel = /dev/hvc9

# 内核模块 mac80211_hwsim 的扫描档位参数（本服务校验后写入，据此注入假 AP）
scan_profile = /sys/module/mac80211_hwsim/parameters/scan_profile

# 通道单帧上限（字节，与事件通道 hvc7 一致 1 MiB）
frame_max = 1048576

# 通道断线重连间隔（毫秒）
reconnect_delay_ms = 1000

# 读超时（毫秒，超时向 host 发 ping 保活）
read_timeout_ms = 30000

# 通道协议版本（hello 帧上报）
protocol_version = 1
