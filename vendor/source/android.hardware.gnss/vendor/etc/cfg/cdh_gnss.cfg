# gold 机型 GNSS 设备值 —— 供 hal/android15 gnss 引擎运行时读取
# （/vendor/etc/cfg/cdh_gnss.cfg）。逐条取自真机 dumpsys location 的 GNSS Manager
#  段与 gps provider 段（Redmi Note 13 5G, MTK MNLD）。改默认 fix/能力位只编辑本文件，
#  不必重编 HAL。
#
# 格式：每行 `key=value`；'#' 起注释、空行忽略；value 原样取到行尾。
# 缺文件/缺键时服务回退内置保守默认（仍可起）。

# 控制文件路径：向该文件写 key=value（longitude/latitude/altitude/velocity/accuracy/
# time_ms/satellites）即注入一次 fix（宿主 fishbridge `geo fix` 约定路径）。
control_file=/data/vendor/gps/fix

# 默认 fix（start() 与未注入时下发；经纬度取自真机 network provider 末次定位实测值）
default_longitude=120.008549
default_latitude=30.289452
default_altitude_meters=15.5
default_speed_meters_per_second=3.2
default_horizontal_accuracy_meters=1
default_satellites=7

# 能力位（IGnssCallback.gnssSetCapabilitiesCb / 各子回调 setCapabilitiesCb）：
# 本虚拟 HAL 只声明 SCHEDULING(=1)，不产生测量值/导航电文/天线信息/PSDS。
gnss_capabilities=1
power_capabilities=1
measurement_corrections_capabilities=0

# systemInfo（IGnssCallback.gnssSetSystemInfoCb）：真机 GNSS Hardware Model Name。
# yearOfHw=0 表示真机未上报有效年份（AIDL 语义未知）。
year_of_hw=0
system_info_name=MediaTek,MT,MTK_MNLD_14_1.00,MNL_VER_24100901ALPS05_8.00_00
