# gold 机型灯清单 —— 供 hal/android15 light 引擎运行时读取（/vendor/etc/cfg/cdh_light.cfg）。
# 格式：light = <id> | <ordinal> | <TYPE>
#   TYPE ∈ BACKLIGHT KEYBOARD BUTTONS BATTERY NOTIFICATIONS ATTENTION BLUETOOTH WIFI
#        MICROPHONE CAMERA
# '#' 起为注释；空行忽略。逐条取自真机 dumpsys lights（id/ordinal 不按 type 去重推导）。
# 改灯只编辑本文件，不必重编驱动。
light = 0 | 0 | BACKLIGHT
light = 1 | 0 | KEYBOARD
light = 2 | 0 | BUTTONS
light = 3 | 0 | BATTERY
light = 4 | 0 | NOTIFICATIONS
light = 5 | 0 | ATTENTION
light = 6 | 1 | BLUETOOTH
light = 7 | 1 | WIFI
