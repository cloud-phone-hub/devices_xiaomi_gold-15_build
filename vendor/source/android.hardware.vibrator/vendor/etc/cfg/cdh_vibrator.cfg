# gold 机型振动能力清单 —— 供 hal/android15 vibrator 引擎运行时读取
# （/vendor/etc/cfg/cdh_vibrator.cfg）。逐条取自真机 dumpsys vibrator_manager
# 的 Vibrators -> VibratorInfo 段。改能力只编辑本文件，不必重编驱动。
#
# 键（'#' 起为注释；空行忽略）：
#   register_vibrator_manager      = true|false
#   ivibrator_capabilities         = <int>   # getCapabilities 位掩码（0：无 amplitude/callback）
#   ivibrator_manager_capabilities = <int>
#   composition_delay_max          = <int>
#   composition_size_max           = <int>
#   vibrator_id                    = <int>   # 可重复
#   effect                         = <NAME>  # 可重复
register_vibrator_manager = true
ivibrator_capabilities = 0
ivibrator_manager_capabilities = 0
composition_delay_max = 1000
composition_size_max = 256
vibrator_id = 1
effect = CLICK
effect = DOUBLE_CLICK
effect = TICK
effect = HEAVY_CLICK
effect = TEXTURE_TICK
