# gold 机型 thermal 清单 —— 供 hal/android15 thermal 引擎运行时读取
# （/vendor/etc/cfg/cdh_thermal.cfg）。逐条取自真机 dumpsys thermalservice 的 HAL 段。
# 改传感器/阈值/模型参数只编辑本文件，不必重编驱动。
#
# 阈值数组按 ThrottlingSeverity 顺序 7 段：
#   NONE;LIGHT;MODERATE;SEVERE;CRITICAL;EMERGENCY;SHUTDOWN（未设置用 nan）
# sensor = <type:int> | <name> | <value:float> | <hot> | <cold>
# cooling = <type:int> | <name> | <value:int>

# ---- 模型 / 采样 ----
skin_temperature_name = SKIN
skin_temperature_celsius = 27.843
model_maximum_celsius = 50
model_heating_seconds = 20
model_cooling_seconds = 45
model_sample_interval_ms = 1000

# ---- 温度传感器 ----
sensor = 0  | CPU              | 29.174 | nan;nan;nan;85;90;100;117   | nan;nan;nan;nan;nan;nan;nan
sensor = 1  | GPU              | 29.174 | nan;nan;nan;85;90;100;117   | nan;nan;nan;nan;nan;nan;nan
sensor = 2  | BATTERY          | 26.0   | nan;nan;nan;50;55;59;60     | nan;nan;nan;nan;nan;nan;nan
sensor = 3  | SKIN             | 27.843 | nan;43;45;50;70;80;90       | nan;nan;nan;nan;nan;nan;nan
sensor = 5  | POWER_AMPLIFIER  | 28.128 | nan;nan;nan;68;90;100;110   | nan;nan;nan;nan;nan;nan;nan
sensor = 9  | NPU              | 29.174 | nan;nan;nan;85;90;100;117   | nan;nan;nan;nan;nan;nan;nan
sensor = 10 | TPU              | 29.174 | nan;nan;nan;85;90;100;117   | nan;nan;nan;nan;nan;nan;nan
sensor = 13 | SOC              | 29.174 | nan;nan;nan;85;90;100;117   | nan;nan;nan;nan;nan;nan;nan

# ---- 冷却设备 ----
cooling = 3 | devfreq-13000000.mali | 0
